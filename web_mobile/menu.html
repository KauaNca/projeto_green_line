<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header E-commerce GreenLine</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilo geral do header */
        .holo-header {
            position: relative;
            background: linear-gradient(135deg, #064e3b, #059669, #34d399);
            color: #ffffff;
            padding: 1rem 0;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        /* Camada de fundo com linhas diagonais minimalistas */
        .holo-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M0 100L100 0M20 100L120 0" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/></svg>') repeat;
            opacity: 0.3; /* Mais sutil */
            animation: holo-move 15s linear infinite;
            pointer-events: none; /* Impede bloqueio de interações */
            z-index: 1; /* Abaixo dos elementos interativos */
        }

        /* Camada adicional para efeito 3D */
        .holo-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.2) 0%, transparent 70%);
            opacity: 0.4;
            animation: pulse 10s ease-in-out infinite;
            pointer-events: none; /* Impede bloqueio de interações */
            z-index: 1; /* Abaixo dos elementos interativos */
        }

        /* Animação para o fundo de linhas diagonais */
        @keyframes holo-move {
            0% { background-position: 0 0; }
            100% { background-position: 200px -200px; }
        }

        /* Animação para o efeito 3D radial */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.4; }
        }

        /* Garante que elementos interativos estejam acima */
        .navbar, .search-bar, .nav-link, .icon-btn, .navbar-brand {
            position: relative;
            z-index: 2;
        }

        input::placeholder{
            color: white !important;;
        }

        /* Efeito 3D nos links do menu */
        .nav-link {
            color: #e6fffa !important;
            font-weight: 600;
            transition: all 0.3s ease;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .nav-link:hover {
            color: #ffffff !important;
            transform: translateY(-3px) scale(1.05);
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.9), 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* Estilo do campo de busca com profundidade */
        .search-bar {
            max-width: 400px;
            position: relative;
        }

        .search-bar input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 25px;
            color: #ffffff;
            padding-right: 40px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
            cursor: text;
        }

        .search-bar input:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.7), inset 0 2px 5px rgba(0, 0, 0, 0.2);
            border-color: #34d399;
            outline: none;
        }

        .search-bar .fa-search {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #e6fffa;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        /* Ícones de carrinho e login com efeito 3D */
        .icon-btn {
            color: #e6fffa !important;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .icon-btn:hover {
            color: #ffffff !important;
            transform: translateY(-3px) scale(1.1);
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.9);
        }

        /* Logo com efeito neon 3D */
        .navbar-brand {
            color: #ffffff !important;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.8), 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .navbar-brand:hover {
            text-shadow: 0 0 25px rgba(52, 211, 153, 1), 0 6px 15px rgba(0, 0, 0, 0.5);
            transform: scale(1.05);
        }

        /* Ajustes para dispositivos menores */
        @media (max-width: 991px) {
            .navbar-collapse {
                background: rgba(5, 150, 105, 0.95); /* Fundo verde escuro para a sidebar */
                position: fixed;
                top: 0;
                left: 0;
                width: 250px; /* Largura fixa para a sidebar */
                height: 100vh; /* Ocupa toda a altura da tela */
                padding: 1rem;
                margin: 0;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
                z-index: 2000; /* Acima de outros elementos */
                transform: translateX(0); /* Garante que fique visível */
            }

            /* Ajusta a transição do menu colapsado */
            .navbar-collapse.collapsing,
            .navbar-collapse.show {
                transition: transform 0.3s ease-in-out;
            }

            /* Botão toggler alinhado à direita */
            .navbar-toggler {
                margin-left: auto;
            }

            /* Ajusta a barra de busca */
            .search-bar {
                max-width: 100%;
                margin: 1rem 0;
            }

            /* Alinhamento dos links no menu colapsado */
            .navbar-nav {
                padding: 1rem 0;
            }

            .nav-item {
                margin: 0.5rem 0;
            }

            .nav-link {
                font-size: 1.1rem;
                padding: 0.5rem 1rem;
            }

            /* Ícones de carrinho e login no menu colapsado */
            .icon-btn {
                font-size: 1.2rem;
                padding: 0.5rem 1rem;
            }

            /* Logo em telas menores */
            .navbar-brand {
                font-size: 1.5rem;
                margin-right: 0.5rem;
            }

            /* Garante que o contêiner não cause deslocamento */
            .container {
                padding-left: 15px;
                padding-right: 15px;
            }
        }

        /* Ajuste para telas muito pequenas (ex.: < 576px) */
        @media (max-width: 576px) {
            .navbar-collapse {
                width: 200px; /* Reduz a largura para telas muito pequenas */
            }

            .navbar-brand {
                font-size: 1.2rem;
            }

            .nav-link {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header com Navbar -->
    <header class="holo-header">
        <nav class="navbar navbar-expand-lg container">
            <!-- Logo -->
             <img src="img/logo.png" alt="">
            <a class="navbar-brand" href="#">GreenLine</a>
            <!-- Botão para menu mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Conteúdo da Navbar -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Menu de navegação -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Categorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Ofertas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contato</a>
                    </li>
                </ul>
                <!-- Barra de busca -->
                <div class="search-bar d-flex align-items-center mx-lg-3">
                    <input type="text" class="form-control text-white " placeholder="Buscar produtos...">
                    <i class="fas fa-search"></i>
                </div>
                <!-- Ícones de carrinho e login -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link icon-btn" href="#"><i class="fas fa-shopping-cart"></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link icon-btn" href="#"><i class="fas fa-user"></i></a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Bootstrap 5 JS e Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
