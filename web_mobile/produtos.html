<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" href="estilo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <!-- place navbar here -->
    </header>
    <main>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12 col-md-5">
                    <form class="d-flex justify-content-start">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Search">
                            <button class="btn btn-danger" type="submit">
                                Procurar
                            </button>
                        </div>
                    </form>
                </div>
                <div class="col-12 col-md-7 d-flex justify-content-end">
                    <form class="me-3 d-inline-block">
                        <h4 class="mb-0">Ordem por:</h4> <!-- H4 indicando a ordem -->
                        <select class="form-select form-select-sm">
                            <option>Todos os produtos</option>
                            <option>Menor preço</option>
                            <option>Maior preço</option>
                            <option>Produto</option>
                        </select>
                    </form>
                    <nav class="d-inline-block"> 
                        <h4 class="mb-0">Páginas:</h4> 
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item disabled">
                                <a class="page-link" href="#" tabindex="-1">1</a>
                            </li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item"><a class="page-link" href="#">3</a></li>
                            <li class="page-item"><a class="page-link" href="#">4</a></li>
                            <li class="page-item"><a class="page-link" href="#">5</a></li>
                            <li class="page-item"><a class="page-link" href="#">6</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
            <hr class="mt-3">
            <div class="row">
                <a href="#" class="text-decoration-none text-dark">
                    <!-- style do card -->
                    <div class="card" style="width: 13rem; border: 1px solid rgba(0, 0, 0, 0.1);">
                      <!-- Card img --> 
                      <img src="/web_mobile/img/0d2718b1-5bc3-437c-aeb2-570da553d057.jpg" class="card-img-top" alt="Produto">
                      <!-- style body card -->
                      <div class="card-body p-2"> 
                        <h6 class="card-title mb-1 product-name">Nome do Produto</h6>
                        <p class="text-warning mb-1">★★★★☆ <span class="text-secondary">1.245 avaliações</span></p>
                        <small class="text-secondary">Muito calor</small>
                        <p class="fw-bold fs-7 text-dark mb-0 ">R$199,99</p>
                      </div>
                    </div>
                  </a>   
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        
    </main>
    <footer>
        <!-- place footer here -->
    </footer>

</body>

</html>
