<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Estilizando o footer */
        footer {
            background-color: black; /* Fundo branco */
        }

        /* Estilizando os links */
        .nav-link {
            position: relative;
            color: #787e83 !important; /* Cor padrão do text-muted */
            transition: all 0.3s ease; /* Transição suave para o efeito */
        }

        /* Efeito 3D ao passar o mouse */
        .nav-link:hover {
            color: #28a745 !important; /* Verde ao passar o mouse (tema GreenLine) */
            transform: translateY(-5px) scale(1.1); /* Salto para cima e leve aumento */
            text-shadow: 0 5px 10px rgba(0, 0, 0, 0.5), /* Sombra para profundidade */
                        0 0 5px rgba(40, 167, 69, 0.5); /* Brilho verde */
        }

        /* Linha inferior do footer */
        .border-bottom {
            border-color: #dee2e6 !important; /* Cinza padrão do Bootstrap */
        }

        /* Texto inferior */
        .text-muted {
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="">
        <footer class="container-fluid py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted fs-4"><i class="bi bi-house"></i></a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted fs-4"><i class="bi bi-building"></i> <!-- Ícone de prédio --></a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted fs-4"><i class="bi bi-envelope"></i> </a>
                </li>
            </ul>
            <p class="text-center text-muted">71080-020 | CNPJ : 74.707.730/0001-63 | Ceilândia, Brasília-DF</p>
            <p class="text-center text-muted">© 2025 GreenLine</p>
        </footer>
    </div>
</body>
</html>
