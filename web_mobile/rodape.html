<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilizando o footer */
        footer {
            background-color: #ffffff; /* Fundo branco */
        }

        /* Estilizando os links */
        .nav-link {
            position: relative;
            color: #787e83 !important; /* Cor padrão do text-muted */
            transition: all 0.3s ease; /* Transição suave para o efeito */
        }

        /* Efeito 3D ao passar o mouse */
        .nav-link:hover {
            color: #28a745 !important; /* Verde ao passar o mouse (tema GreenLine) */
            transform: translateY(-5px) scale(1.1); /* Salto para cima e leve aumento */
            text-shadow: 0 5px 10px rgba(0, 0, 0, 0.5), /* Sombra para profundidade */
                        0 0 5px rgba(40, 167, 69, 0.5); /* Brilho verde */
        }

        /* Linha inferior do footer */
        .border-bottom {
            border-color: #dee2e6 !important; /* Cinza padrão do Bootstrap */
        }

        /* Texto inferior */
        .text-muted {
            color: #787e83 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted">Features</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted">Pricing</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted">FAQs</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-muted">About</a>
                </li>
            </ul>
            <p class="text-center text-muted">© 2025 GreenLine</p>
        </footer>
    </div>
</body>
</html>
