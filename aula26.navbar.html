<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar bg-light px-2 py-3 navbar-expand-lg">
        <div class="container">
            <a href="#" class="navbar-brand d-flex align-items-center">
                <i class="bi-bootstrap-fill fs-1"></i>
                <span class="ms-1">Bootstrap 5</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <div class="navbar-nav">
                    <a href="#" class="nav-link active">
                        Home

                    </a>
                    <div class="dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            Produtos
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li class="drowpdown-item">
                                <a href="#" class="nav-link">
                                    Item 1
                                </a>
                            </li>
                            <li class="drowpdown-item">
                                <a href="#" class="nav-link">
                                    Item 2
                                </a>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>
        </div>

    </nav>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado"
            aria-controls="conteudoNavbarSuportado" aria-expanded="false" aria-label="Alterna navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="conteudoNavbarSuportado">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home <span class="sr-only">(página atual)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                        data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Dropdown
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="#">Ação</a>
                        <a class="dropdown-item" href="#">Outra ação</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">Algo mais aqui</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#">Desativado</a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0">
                <input class="form-control mr-sm-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
                <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Pesquisar</button>
            </form>
        </div>
    </nav>

     <!--navbar: customização de uma barra de navegação
            nabvar-expand-(): indica a aparição dos itens da barra de acordo com o breakpoint
            navbar-brand: customização para logo, marca, título da empresa
            navbar-collapse: customização para barra de navegação que quebra,pode ser escondida
            collapse: indica que o espaço pode se escondido
            navbar-nav: navegação dentro de uma barra

            data-bs-toggle: indica o tipo de alternância, até agora só vi duas: collapse(esconde) e dropdown.
            
        -->

</body>

</html>
