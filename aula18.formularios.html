<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container p-5">
        <form class="form">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome:</label>
                <input type="text" class="form-control" placeholder="Digite seu email" id="nome" />
                <div class="form-text">Nunca vamos compartilhar seu email</div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" id="lembrar" class="form-check-input">
                <label class="form-label">Lembrar de mim </label>
            </div>
            <div class="mb-3">
                <label class="form-label">TESTE READONLY</label>
                <input type="text" class="form-control" value="Kauã Nunes" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">TESTE FORM-CONTROL-PLAINTEXT</label>
                <input type="text" class="form-control form-control-plaintext" value="Kauã Nunes" readonly>
            </div>
            <div class="mb-3">
                <input type="file" class="form-control-base">
            </div>
            <div class="form-group">
                <label for="exampleFormControlSelect2">Exemplo de select múltiplo</label>
                <select multiple class="form-control" id="exampleFormControlSelect2">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <div class="mb-3 form-group">
                <label for="exampleFormControlSelect1">Select de exemplo</label>
                <select class="form-control" id="exampleFormControlSelect1">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <!-- CASO NÃO DEFINA UMA LARGURA, OCUPA TODO O CONTAINER-->
            <div class="mb-3 form-group">

                <select class="form-select" multiple size=2 id="exampleFormControlSelect1">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>

            <button type="submit" class="btn btn-danger">Entrar</button>

            <button type="" class=" btn btn-outline-danger btn-sm">Link</button>
            <button type="" class="btn btn-outline-warning">Link</button>
            <button type="" class="btn btn-outline-success btn-lg">Link</button>

            <hr>
            <!--form-check-reverse / form-=check-inline-->
            <div class="mb-3 form-check form-check-reverse">
                <input type="radio" class="form-check-input" name="radio">
                <label class="form-check-label">1</label>
            </div>
            <div class="mb-3 form-check form-check-reverse">
                <input type="radio" class="form-check-input" name="radio">
                <label class="form-check-label">2</label>
            </div>
            <div class="mb-3 form-switch">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">1</label>
            </div>

            <!--BOTÃO TIPO RÁDIO-->
            <!--Perceba que somente o tipo radio e checkbox consegue fazer esta alternação.
            No switch era necessário do type=checkbox pois ele possui a funcionalidade de desmarcar e marcar
            -->
            <div class="mb-3">
                <input type="radio" class="btn-check " name="teste" id="teste1">
                <label for="teste1" class="btn btn-outline-danger">teste 1</label>
            </div>
            <div class="mb-3">
                <input type="radio" class="btn-check" name="teste" id="teste2">
                <label for="teste2" class="btn btn-outline-danger">teste 2</label>
            </div>

            <!--CAMPOS COM TÍTULO FLUTUANTE
                colocar palavras dentro do input de forma flutuante
            -->
        
            <div class="mb-3 form-floating">
                <input type="email" class="form-control" id="email" placeholder=" ">
                <label for="email" class="form-label">Email</label>
            </div>
            <div class="mb-3 form-floating">
                <select class="form-control" size=2 id="select" placeholder=" ">
                    <option>1</option>
                    <option>2</option>
                </select>
                <label for="select" class="form-label">OPÇÕES</label>
            </div>
        </form>
    </div>
</body>

</html>
